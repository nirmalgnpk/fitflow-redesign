name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required documents exist
        run: |
          test -f README.md
          test -f docs/tech-stack-summary.md
          test -f docs/comparison-matrix.md
          test -f docs/architecture.png
          test -f docs/adr/ADR-001-technology-stack.md
